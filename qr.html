<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zoofenster Zugangscodes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f7fa;
      padding: 30px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .logo {
      width: 220px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 40px;
    }

    .qr-section {
      display: inline-block;
      width: 40%;
      margin: 20px;
      vertical-align: top;
    }

    .qr-title {
      font-size: 22px;
      margin-bottom: 20px;
    }

    canvas {
      margin-top: 20px;
      width: 280px !important;
      height: 280px !important;
    }

    .refresh {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>

<body>

<div class="container">

  <!-- ✅ Logo -->
  <img src="Engie-Logo_neu.png" class="logo">

  <h1>Zoofenster Zugang</h1>
  <p class="subtitle">Bitte passenden Code scannen</p>

  <!-- ✅ EINCHECKEN -->
  <div class="qr-section">
    <div class="qr-title">✅ Einchecken</div>
    <canvas id="qrIn"></canvas>
  </div>

  <!-- ✅ AUSCHECKEN -->
  <div class="qr-section">
    <div class="qr-title">🚪 Auschecken</div>
    <canvas id="qrOut"></canvas>
  </div>

  <div class="refresh">
    Codes werden automatisch aktualisiert (Sicherheitsfunktion)
