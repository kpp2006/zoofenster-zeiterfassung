<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zoofenster QR Anzeige</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 40px;
    }

    h1 {
      margin-bottom: 40px;
    }

    .section {
      margin-bottom: 60px;
    }

    canvas {
      margin-top: 20px;
    }
  </style>

  <!-- QR Code Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>

<body>

<h1>Zoofenster Zeiterfassung</h1>

<div class="section">
  <h2>✅ Arbeitsbeginn</h2>
  <canvas id="qrIn"></canvas>
</div>

<div class="section">
  <h2>🚪 Arbeitsende</h2>
  <canvas id="qrOut"></canvas>
</div>

<script>

// 👉 Basis URL deiner Buchungsseite
const BASE = "https://kpp2006.github.io/zoofenster-zeiterfassung/";

// 👉 TOKEN generieren (Tag + Stunde)
function generateToken() {
  const now = new Date();

  const day = now.toISOString().slice(0,10);  // yyyy-MM-dd
  const hour = now.getHours();                // Stunde

  return btoa(day + "-" + hour); // Base64 Encoding
}

// 👉 QR generieren
function generateQR() {

  const token = generateToken();

  const linkIn = BASE + "?type=IN&token=" + token;
  const linkOut = BASE + "?type=OUT&token=" + token;

  QRCode.toCanvas(document.getElementById("qrIn"), linkIn);
  QRCode.toCanvas(document.getElementById("qrOut"), linkOut);

}

// 👉 initial anzeigen
generateQR();

// 👉 jede Minute prüfen (falls Stunde gewechselt hat)
setInterval(generateQR, 60000);

</script>

</body>
</html>
