<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zoofenster Zugangscodes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f7fa;
      padding: 30px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .logo {
      width: 220px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 40px;
    }

    /* ✅ wichtig: nebeneinander */
    .qr-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 60px;
      flex-wrap: wrap;
    }

    .qr-section {
      text-align: center;
    }

    .qr-title {
      font-size: 22px;
      margin-bottom: 20px;
    }

    canvas {
      width: 300px !important;
      height: 300px !important;
    }

    .refresh {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }

  </style>

  <!-- ✅ QR Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>

<body>

<div class="container">

  <!-- ✅ LOGO korrekt -->
  <img src="Engie-Logo_neu.png" class="logo">

  <h1>Zoofenster Zugang</h1>
  <p class="subtitle">Bitte passenden Code scannen</p>

  <!-- ✅ QR Codes nebeneinander -->
  <div class="qr-wrapper">

    <div class="qr-section">
      <div class="qr-title">✅ Einchecken</div>
      <canvas id="qrIn"></canvas>
    </div>

    <div class="qr-section">
      <div class="qr-title">🚪 Auschecken</div>
      <canvas id="qrOut"></canvas>
    </div>

  </div>

  <div class="refresh">
    Codes werden automatisch aktualisiert (Sicherheitsfunktion)
  </div>

</div>

<script>

// 👉 Basis URL deiner index.html
const BASE = "https://kpp2006.github.io/zoofenster-zeiterfassung/";

// 👉 Token generieren (Tag + Stunde)
function generateToken() {
  const now = new Date();
  const day = now.toISOString().slice(0,10);
  const hour = now.getHours();
  return btoa(day + "-" + hour);
}

// 👉 QR Codes erstellen
function generateQR() {

  const token = generateToken();

  const linkIn = BASE + "?type=IN&token=" + token;
  const linkOut = BASE + "?type=OUT&token=" + token;

  const qrInCanvas = document.getElementById("qrIn");
  const qrOutCanvas = document.getElementById("qrOut");

  if (!qrInCanvas || !qrOutCanvas) return;

  QRCode.toCanvas(qrInCanvas, linkIn, {
    width: 300,
    margin: 2
  });

  QRCode.toCanvas(qrOutCanvas, linkOut, {
    width: 300,
    margin: 2
  });
}

// ✅ WICHTIG: warten bis Seite geladen ist
window.onload = function() {
  generateQR();
  setInterval(generateQR, 60000);
};

</script>

</body>
</html>
