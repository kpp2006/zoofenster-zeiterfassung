<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zoofenster Zeiterfassung</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 80px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #status {
      font-size: 24px;
      font-weight: bold;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<h2>Zoofenster Zeiterfassung</h2>
<p id="status">Bitte warten...</p>

<script>

const ENDPOINT = "https://default24139d14c62c4c478bddce71ea1d50.cf.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/7aa3eb7925224dad95647d9a7470c868/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=fo3vOPqeJ45P5jJjNQ4TLGpvUZPRj7GCjrW0rUbjc0Y";

// 👉 Gerät-ID
if (!localStorage.scanId) {
  localStorage.scanId = crypto.randomUUID();
}

// 👉 letzte Aktion lesen
let lastAction = localStorage.lastAction;

// 👉 Logik bestimmen
let type;

if (!lastAction || lastAction === "OUT") {
  type = "IN";
} else {
  type = "OUT";
}

// 👉 an Flow senden
fetch(ENDPOINT, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    scanId: localStorage.scanId,
    type: type,
    project: "Zoofenster"
  })
});

// 👉 neue Aktion speichern
localStorage.lastAction = type;

// 👉 Anzeige
document.getElementById("status").innerText =
  type === "IN"
  ? "✅ Erfolgreich eingestempelt"
  : "🚪 Erfolgreich ausgestempelt";

</script>

</body>
</html>
