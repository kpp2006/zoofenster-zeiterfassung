<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- ✅ WICHTIG für Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zoofenster Zugang</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 25px;
      width: 95%;
      max-width: 420px;
      margin: auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .logo {
      width: 180px;
      max-width: 80%;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
    }

    #status {
      font-size: 22px;
      font-weight: bold;
      margin-top: 30px;
      padding: 15px;
      border-radius: 10px;
      background: #f0f4f8;
      line-height: 1.4;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- ✅ Logo korrekt -->
  <img src="Engie-Logo_neu.png" class="logo">

  <h2>Zoofenster Zugang</h2>
  <p class="subtitle">Bitte Scanvorgang abwarten</p>

  <p id="status">⏳ Verbindung wird hergestellt...</p>

</div>

<script>

// 👉 FLOW ENDPOINT (deiner)
const ENDPOINT = "https://default24139d14c62c4c478bddce71ea1d50.cf.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/7aa3eb7925224dad95647d9a7470c868/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=fo3vOPqeJ45P5jJjNQ4TLGpvUZPRj7GCjrW0rUbjc0Y";

// 👉 Geräte-ID speichern
if (!localStorage.scanId) {
  localStorage.scanId = crypto.randomUUID();
}

// 👉 URL Parameter lesen
const params = new URLSearchParams(window.location.search);

const type = params.get("type");
const token = params.get("token");

// 👉 Anzeige
const status = document.getElementById("status");

// 👉 Validierung
if ((type === "IN" || type === "OUT") && token) {

  status.innerText = "⏳ Vorgang läuft...";

  fetch(ENDPOINT, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      scanId: localStorage.scanId,
      type: type,
      project: "Zoofenster",
      token: token
    })
  })

.then(response => response.json())
.then(data => {

  // 🔴 Doppel-IN
  if (data.status === "BLOCK_IN") {
    status.innerText = "⚠️ Bereits eingecheckt";
    status.style.background = "#ffe0e0";
    return;
  }

  // 🔴 Doppel-OUT
  if (data.status === "BLOCK_OUT") {
    status.innerText = "⚠️ Kein gültiger vorheriger Check-In";
    status.style.background = "#ffe0e0";
    return;
  }

  // ✅ Erfolgreich
  if (type === "IN") {
    status.innerText = "✅ Erfolgreich eingecheckt";
    status.style.background = "#e0ffe5";
  } else {
    status.innerText = "🚪 Erfolgreich ausgecheckt";
    status.style.background = "#e0ffe5";
  }


  })
  .catch(err => {
    console.error(err);
    status.innerText = "❌ Fehler – bitte erneut scannen";
  });

} else {

  status.innerText = "⚠️ Ungültiger QR-Code";

}

</script>

</body>
</html>
