<script>

const ENDPOINT = "DEINE_FLOW_URL";

// Gerät-ID
if (!localStorage.scanId) {
  localStorage.scanId = crypto.randomUUID();
}

// letzter Status sauber lesen
let lastAction = localStorage.getItem("lastAction");

// Fallback absichern
if (lastAction !== "IN" && lastAction !== "OUT") {
  lastAction = "OUT";
}

// nächste Aktion bestimmen
let type = (lastAction === "OUT") ? "IN" : "OUT";

// senden
fetch(ENDPOINT, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    scanId: localStorage.scanId,
    type: type,
    project: "Zoofenster"
  })
});

// speichern
localStorage.setItem("lastAction", type);

// Anzeige
document.getElementById("status").innerText =
  type === "IN"
  ? "✅ Eingestempelt"
  : "🚪 Ausgestempelt";

</script>
