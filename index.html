<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zoofenster Zeiterfassung</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 80px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #status {
      font-size: 26px;
      font-weight: bold;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<h2>Zoofenster Zeiterfassung</h2>
<p id="status">Bitte warten...</p>

<script>

// 👉 DEIN FLOW ENDPOINT
const ENDPOINT = "https://default24139d14c62c4c478bddce71ea1d50.cf.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/7aa3eb7925224dad95647d9a7470c868/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=fo3vOPqeJ45P5jJjNQ4TLGpvUZPRj7GCjrW0rUbjc0Y";

// 👉 Geräte-ID (einmalig)
if (!localStorage.scanId) {
  localStorage.scanId = crypto.randomUUID();
}

// 👉 URL Parameter holen
const params = new URLSearchParams(window.location.search);

const type = params.get("type");
const token = params.get("token");

// 👉 Status-Element
const status = document.getElementById("status");

// 👉 prüfen was vorhanden ist
if ((type === "IN" || type === "OUT") && token) {

  status.innerText = "⏳ Buchung läuft...";

  // 👉 Request senden
  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      scanId: localStorage.scanId,
      type: type,
      project: "Zoofenster",
      token: token   // 🔥 EXTREM WICHTIG
    })
  });

  // 👉 Feedback anzeigen
  setTimeout(() => {
    status.innerText =
      type === "IN"
        ? "✅ Erfolgreich eingestempelt"
        : "🚪 Erfolgreich ausgestempelt";
  }, 1000);

} else {

  status.innerText = "⚠️ Ungültiger QR-Code";

}

</script>

</body>
</html>
